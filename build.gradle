plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}


// The current smoke test is a standalone Java main(), not a JUnit test.
// Gradle 9 fails when test sources exist but it finds no JUnit tests.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

// Execute the existing smoke test as part of normal builds.
tasks.register('coreSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Run the dependency-free FMS flight-planner smoke tests.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cc.fentware.fms.core.FlightPlannerSmokeTest'
}

tasks.named('check') {
    dependsOn tasks.named('coreSmokeTest')
}
